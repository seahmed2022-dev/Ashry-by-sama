<!-- Only used for Netlify's build-time form detection. Not served to users. -->
<html>
  <body>
    <form name="order-request" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="order-request" />
      <input name="name" />
      <input name="phone" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
