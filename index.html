    <style>
        :root {
            /* تعديل الألوان لتصبح التدرجات الوردية (Pink) هي الطاغية */
            --primary-color: #d81b60;
            --secondary-color: #f48fb1;
            --accent-pink: #f06292;
            --bg-color: #fff5f8;
            --card-bg: #ffffff;
            --text-color: #212529;
            --out-of-stock: #e63946;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background-color: var(--primary-color);
            color: white;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.25);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 12px rgba(216, 27, 96, 0.08);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            border: 1px solid #fce4ec;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(216, 27, 96, 0.15);
        }

        .product-category {
            font-size: 0.8rem;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .product-title {
            font-size: 1.1rem;
            margin: 10px 0;
            font-weight: 600;
        }

        .product-price {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
        }

        .status-badge {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .in-stock {
            background-color: #e8f5e9;
            color: #2e7d32;
        }

        .out-of-stock {
            background-color: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>

function removeDuplicates(products) {
    const uniqueMap = new Map();
    products.forEach(product => {
        const normalizedName = product.name.trim().toLowerCase();
        if (!uniqueMap.has(normalizedName)) {
            uniqueMap.set(normalizedName, product);
        }
    });
    return Array.from(uniqueMap.values());
}

const productsList = removeDuplicates(rawProductsList);

function displayProducts(products) {
    const grid = document.getElementById('productsGrid');
    grid.innerHTML = '';

    products.forEach(product => {
        const card = document.createElement('div');
        card.className = 'product-card';
        
        const statusClass = product.inStock ? 'in-stock' : 'out-of-stock';
        const statusText = product.inStock ? 'متوفر' : 'غير متوفر';

        card.innerHTML = `
            <span class="status-badge ${statusClass}">${statusText}</span>
            <div>
                <div class="product-category">${product.category}</div>
                <div class="product-title">${product.name}</div>
            </div>
            <div class="product-price">${product.price} EGP</div>
        `;
        grid.appendChild(card);
    });
}

function filterProducts(category) {
    const buttons = document.querySelectorAll('.filter-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    if (category === 'all') {
        displayProducts(productsList);
    } else {
        const filtered = productsList.filter(p => p.category === category);
        displayProducts(filtered);
    }
}
